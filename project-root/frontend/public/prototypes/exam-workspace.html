<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>考试工坊 — 蜀道安全助手</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .exam-form { max-width: 760px; padding: 24px; }
    .type-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
    .type-item { display: flex; align-items: center; gap: 8px; }
    .type-item label { flex: none; width: 54px; font-size: 13px; color: var(--text-secondary); }
    .type-item input { width: 72px; }
    .checkbox { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .checkbox input { accent-color: var(--primary); }
    .preview-card { margin-bottom: 14px; }
    .preview-card .label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
    .preview-card .value { font-size: 14px; color: var(--text-primary); font-weight: 500; }
    .preview-counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .preview-count { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-input); font-size: 13px; color: var(--text-secondary); }
    .preview-count b { color: var(--primary); }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo"><span class="logo-mark">蜀</span>蜀道安全助手</span>
      <span class="module-crumb">/ 考试工坊</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="消息通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge">3</span>
      </button>
      <span class="avatar">张</span>
    </div>
  </header>

  <div class="body">
    <!-- 全局导航 -->
    <aside class="sidebar">
      <nav class="module-nav">
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          隐患管理
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          AI 智能问答
        </button>
        <button class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          考试工坊
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          消息通知
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          个人中心
        </button>
      </nav>
    </aside>

    <!-- page-main -->
    <main class="main">
      <!-- 子项1：历史记录 -->
      <div class="history-column">
        <div class="history-head">
          <span class="history-title">历史记录</span>
          <button class="btn-primary btn-sm">+ 新建任务</button>
        </div>
        <div class="history-list">
          <div class="history-item active"><span class="dot"></span><span class="ellipsis">高处作业安全培训试卷</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">动火作业安全知识考核</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">临时用电规范考试</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">应急预案演练测试</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">入场安全教育考核</span></div>
        </div>
      </div>

      <!-- 子项2：中间出卷区 -->
      <div class="main-content">
        <h1 class="workspace-title">出卷工作台</h1>
        <div class="workspace-body">
          <div class="exam-form">
            <div class="field">
              <label class="field-label">试卷名称</label>
              <input type="text" id="paper-title" placeholder="请输入试卷名称" value="高处作业安全培训考核" />
            </div>
            <div class="field">
              <label class="field-label">出题依据内容</label>
              <textarea id="basis-content" rows="4" placeholder="请输入章节、知识点或培训内容……"></textarea>
            </div>
            <div class="field">
              <label class="field-label">从附件生成考题 <span class="field-hint">支持 xlsx，最多五个附件</span></label>
              <div class="upload-zone" id="upload-zone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                点击或拖拽上传 xlsx 文件
              </div>
            </div>
            <div class="field">
              <label class="field-label">题型设置</label>
              <label class="checkbox"><input type="checkbox" id="include-basis" /> 附带出题依据条款</label>
              <div class="type-grid" style="margin-top:10px;">
                <div class="type-item"><label>单选</label><input type="number" id="cnt-single" value="10" min="0" /></div>
                <div class="type-item"><label>判断</label><input type="number" id="cnt-judge" value="5" min="0" /></div>
                <div class="type-item"><label>多选</label><input type="number" id="cnt-multi" value="3" min="0" /></div>
                <div class="type-item"><label>简答</label><input type="number" id="cnt-essay" value="2" min="0" /></div>
              </div>
            </div>
            <div style="display:flex;gap:10px;">
              <button class="btn-primary" id="generate-btn">生成试卷</button>
              <button class="btn-ghost">保存草稿</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 子项3：实时预览面板 -->
      <aside class="right-panel">
        <div class="panel-head"><h2 class="panel-title">实时预览</h2></div>
        <div class="panel-body">
          <div class="preview-card">
            <div class="label">试卷名称</div>
            <div class="value" id="pv-title">未命名试卷</div>
          </div>
          <div class="preview-card">
            <div class="label">题型与数量</div>
            <div class="preview-counts" id="pv-counts"></div>
          </div>
          <div class="preview-card">
            <div class="label">出题依据条款</div>
            <div class="value" id="pv-basis">不附带</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="dialog-mask" id="dialog-mask">
    <div class="dialog" id="dialog">
      <div class="dialog-head">
        <h3 class="dialog-title">是否进入题库？</h3>
        <button class="dialog-close" id="dialog-close" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dialog-body">附件中的题目解析完成后，是否同时保存到题库？选择「否」将仅用于当前试卷。</div>
      <div class="dialog-foot">
        <button class="btn-ghost" id="no-bank">否，仅生成试卷</button>
        <button class="btn-primary" id="yes-bank">是，同时进入题库</button>
      </div>
    </div>
  </div>
</div>

<script>
const titleInput=document.getElementById("paper-title");
const includeBasis=document.getElementById("include-basis");
const counts={"cnt-single":"单选","cnt-judge":"判断","cnt-multi":"多选","cnt-essay":"简答"};
function renderPreview(){document.getElementById("pv-title").textContent=titleInput.value.trim()||"未命名试卷";document.getElementById("pv-basis").textContent=includeBasis.checked?"附带":"不附带";const wrap=document.getElementById("pv-counts");wrap.innerHTML="";Object.entries(counts).forEach(([id,label])=>{const n=document.getElementById(id).value||0;const chip=document.createElement("span");chip.className="preview-count";chip.innerHTML=label+" <b>"+n+"</b> 题";wrap.appendChild(chip)})}
[titleInput,includeBasis].forEach(el=>el.addEventListener("input",renderPreview));
Object.keys(counts).forEach(id=>document.getElementById(id).addEventListener("input",renderPreview));
renderPreview();

const mask=document.getElementById("dialog-mask");
const dialog=document.getElementById("dialog");
const head=dialog.querySelector(".dialog-head");
let dragging=false,offsetX=0,offsetY=0,startX=0,startY=0;
function openDialog(){mask.classList.add("show")}
function closeDialog(){mask.classList.remove("show")}
head.addEventListener("mousedown",e=>{dragging=true;startX=e.clientX-offsetX;startY=e.clientY-offsetY});
window.addEventListener("mousemove",e=>{if(!dragging)return;offsetX=e.clientX-startX;offsetY=e.clientY-startY;dialog.style.transform="translate("+offsetX+"px,"+offsetY+"px)"});
window.addEventListener("mouseup",()=>{dragging=false});
document.getElementById("upload-zone").addEventListener("click",openDialog);
document.getElementById("generate-btn").addEventListener("click",openDialog);
document.getElementById("dialog-close").addEventListener("click",closeDialog);
document.getElementById("no-bank").addEventListener("click",closeDialog);
document.getElementById("yes-bank").addEventListener("click",closeDialog);
</script>
</body>
</html>
