<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 智能问答 — 蜀道安全助手</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .chat-area { display: flex; flex-direction: column; height: 100%; }
    .chat-scroll { flex: 1; overflow: auto; padding: 24px 0; }
    .chat-inner { max-width: 760px; margin: 0 auto; padding: 0 24px; }
    .msg { margin-bottom: 22px; display: flex; gap: 12px; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
    .msg.user .msg-avatar { background: var(--primary-light); color: var(--primary); }
    .msg.assistant .msg-avatar { background: var(--divider); color: var(--text-secondary); }
    .bubble { max-width: 82%; padding: 12px 14px; border-radius: var(--radius-card); font-size: 14px; line-height: 1.7; color: var(--text-primary); }
    .msg.user .bubble { background: var(--primary); color: #fff; }
    .msg.assistant .bubble { background: var(--card-bg); border: 1px solid var(--border); }
    .bubble .cited { font-weight: 700; }
    .msg.user .bubble .cited { color: #fff; }
    .citations { margin-top: 12px; }
    .citations-label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
    .chat-inputbar { flex: none; padding: 14px 24px 18px; background: var(--card-bg); border-top: 1px solid var(--border); }
    .input-shell { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; border: 1px solid #d1d5db; border-radius: var(--radius-card); padding: 10px 12px; background: #fff; }
    .input-shell textarea { flex: 1; border: 0; box-shadow: none; padding: 4px 0; height: 40px; }
    .input-shell textarea:focus { box-shadow: none; }
    .send-btn { width: 36px; height: 36px; border: 0; border-radius: var(--radius-input); background: var(--primary); color: #fff; display: grid; place-items: center; }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo"><span class="logo-mark">蜀</span>蜀道安全助手</span>
      <span class="module-crumb">/ AI 智能问答</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="消息通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge">3</span>
      </button>
      <span class="avatar">张</span>
    </div>
  </header>

  <div class="body">
    <!-- 全局导航 -->
    <aside class="sidebar">
      <nav class="module-nav">
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          隐患管理
        </button>
        <button class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          AI 智能问答
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          考试工坊
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          消息通知
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          个人中心
        </button>
      </nav>
    </aside>

    <!-- page-main -->
    <main class="main">
      <!-- 子项1：历史记录 -->
      <div class="history-column">
        <div class="history-head">
          <span class="history-title">历史记录</span>
          <button class="btn-primary btn-sm">+ 新建任务</button>
        </div>
        <div class="history-list">
          <div class="history-item active"><span class="dot"></span><span class="ellipsis">高处作业安全带使用</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">动火作业审批流程</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">临时用电规范咨询</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">应急预案演练要求</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">事故报告流程</span></div>
        </div>
      </div>

      <!-- 子项2：中间聊天区 -->
      <div class="main-content">
        <div class="chat-area">
          <div class="chat-scroll">
            <div class="chat-inner">
              <div class="msg user">
                <div class="msg-avatar">张</div>
                <div class="bubble">高处作业时，安全带应该如何使用？</div>
              </div>
              <div class="msg assistant">
                <div class="msg-avatar">AI</div>
                <div class="bubble">
                  高处作业时，<span class="cited">安全带应高挂低用</span>，将挂钩挂在牢固的构件或专用挂点上，<span class="cited">禁止低挂高用</span>。作业前应检查安全带各部件是否完好，安全绳不得打结或接长使用。
                  <div class="citations">
                    <div class="citations-label">本次回复引用</div>
                    <div class="citation-group">
                      <div class="citation-row" data-group>
                        <span>国家规范</span>
                        <span style="display:flex;align-items:center;gap:4px;">2 条 <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>
                      </div>
                      <div class="citation-list">
                        <div class="citation-item"><a href="#">《建筑施工高处作业安全技术规范》JGJ 80</a><span>第 4.2.1 条</span></div>
                        <div class="citation-item"><a href="#">《安全生产法》</a><span>第 54 条</span></div>
                      </div>
                    </div>
                    <div class="citation-group">
                      <div class="citation-row" data-group>
                        <span>地方规范</span>
                        <span style="display:flex;align-items:center;gap:4px;">1 条 <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>
                      </div>
                      <div class="citation-list">
                        <div class="citation-item"><a href="#">《四川省建设工程安全生产管理办法》</a><span>第 18 条</span></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="msg assistant">
                <div class="msg-avatar">AI</div>
                <div class="bubble">需要我继续补充安全带的日常检查要点吗？</div>
              </div>
            </div>
          </div>
          <div class="chat-inputbar">
            <div class="input-shell">
              <textarea placeholder="请输入你的安全生产问题……"></textarea>
              <button class="send-btn" aria-label="发送">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-4 7 4 7-14-7z"/><path d="M19 12H5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
document.querySelectorAll(".citation-row").forEach(row=>{row.addEventListener("click",()=>{row.classList.toggle("open")})});
</script>
</body>
</html>
