<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隐患管理 — 蜀道安全助手</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .hazard-upload-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
    .empty-state { text-align: center; color: var(--text-tertiary); max-width: 360px; }
    .empty-state svg { width: 48px; height: 48px; color: #d1d5db; margin-bottom: 12px; }
    .empty-state .main-line { font-size: 15px; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-state .sub-line { font-size: 13px; margin-bottom: 18px; }
    .image-frame { position: relative; width: 100%; max-width: 680px; aspect-ratio: 4/3; border-radius: var(--radius-card); background: linear-gradient(135deg,#eef2f7 25%,transparent 25%) -10px 0/20px 20px,linear-gradient(225deg,#eef2f7 25%,transparent 25%) -10px 0/20px 20px,linear-gradient(315deg,#eef2f7 25%,transparent 25%) 0 0/20px 20px,linear-gradient(45deg,#eef2f7 25%,transparent 25%) 0 0/20px 20px,#f8fafc; overflow: hidden; box-shadow: 0 1px 2px rgba(16,24,40,0.06); display: none; }
    .image-frame.show { display: block; }
    .site-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bbox { position: absolute; border: 2px solid; border-radius: 2px; }
    .bbox .label { position: absolute; top: -22px; left: -2px; height: 20px; padding: 0 7px; border-radius: 3px 3px 3px 0; color: #fff; font-size: 11px; line-height: 20px; white-space: nowrap; }
    .bbox.red { border-color: var(--danger); } .bbox.red .label { background: var(--danger); }
    .bbox.orange { border-color: var(--warning); } .bbox.orange .label { background: var(--warning); }
    .bbox.blue { border-color: var(--info); } .bbox.blue .label { background: var(--info); }
    .report-item { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-card); margin-bottom: 12px; }
    .report-item .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .report-item .name { font-size: 14px; font-weight: 600; }
    .report-item .meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 3px; }
    .report-item .fix { font-size: 13px; color: var(--text-secondary); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
    .conf { font-size: 12px; color: var(--text-tertiary); }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo"><span class="logo-mark">蜀</span>蜀道安全助手</span>
      <span class="module-crumb">/ 隐患管理</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="消息通知">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge">3</span>
      </button>
      <span class="avatar">张</span>
    </div>
  </header>

  <div class="body">
    <!-- 全局导航（所有页面共用，固定） -->
    <aside class="sidebar">
      <nav class="module-nav">
        <button class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          隐患管理
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          AI 智能问答
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          考试工坊
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          消息通知
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          个人中心
        </button>
      </nav>
    </aside>

    <!-- page-main：页面主体容器，内部横向三栏 -->
    <main class="main">
      <!-- 子项1：历史记录（模块局部侧边栏，固定在 page-main 内部） -->
      <div class="history-column">
        <div class="history-head"><span class="history-title">历史记录</span></div>
        <div class="history-list">
          <div class="history-item active"><span class="dot"></span><span class="ellipsis">3号桥墩东侧临边防护</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">作业区西侧安全网破损</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">入口处灭火器过期</span></div>
          <div class="history-item"><span class="dot"></span><span class="ellipsis">高处作业未系安全带</span></div>
        </div>
      </div>

      <!-- 子项2：中间主业务区（flex:1） -->
      <div class="main-content">
        <h1 class="workspace-title">隐患图片识别</h1>
        <div class="workspace-body hazard-upload-area">
          <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <div class="main-line">请上传图片（最多 9 张）</div>
            <div class="sub-line">上传后系统将自动识别隐患并标注</div>
            <button class="btn-primary" id="upload-btn">上传图片</button>
          </div>
          <div class="image-frame" id="image-frame">
            <svg class="site-svg" viewBox="0 0 680 510" preserveAspectRatio="xMidYMid slice">
              <rect width="680" height="510" fill="#dfe6ee"/>
              <rect x="40" y="330" width="600" height="180" fill="#cbd5e1"/>
              <rect x="90" y="250" width="120" height="80" fill="#94a3b8"/>
              <rect x="260" y="180" width="180" height="150" fill="#a8b3c0"/>
              <rect x="470" y="270" width="150" height="60" fill="#94a3b8"/>
            </svg>
            <div class="bbox red" style="left:12%;top:34%;width:20%;height:16%;"><span class="label">临边防护缺失</span></div>
            <div class="bbox orange" style="left:38%;top:30%;width:26%;height:32%;"><span class="label">安全网破损</span></div>
            <div class="bbox blue" style="left:72%;top:48%;width:20%;height:15%;"><span class="label">未佩戴安全帽</span></div>
          </div>
        </div>
      </div>

      <!-- 子项3：分析报告面板（独立右列，固定在 page-main 内部） -->
      <aside class="right-panel">
        <div class="panel-head"><h2 class="panel-title">分析报告</h2></div>
        <div class="panel-body" id="report-body">
          <div class="empty-state" style="margin-top:60px;">
            <div class="main-line">暂无分析结果</div>
            <div class="sub-line">上传图片后自动生成</div>
          </div>
        </div>
      </aside>
    </main>
  </div>
</div>

<script>
const emptyState=document.getElementById("empty-state");
const imageFrame=document.getElementById("image-frame");
const uploadBtn=document.getElementById("upload-btn");
const reportBody=document.getElementById("report-body");
const reportHtml=`<div class="report-item"><div class="head"><span class="name">临边防护缺失</span><span class="tag tag-danger">高风险</span></div><div class="meta">位置：3号桥墩东侧临边</div><div class="conf">置信度 92%</div><div class="fix">整改建议：立即设置临时防护，安装正式护栏。</div></div><div class="report-item"><div class="head"><span class="name">安全网破损</span><span class="tag tag-warning">中风险</span></div><div class="meta">位置：作业区西侧外立面</div><div class="conf">置信度 87%</div><div class="fix">整改建议：更换破损安全网，检查相邻区域。</div></div><div class="report-item"><div class="head"><span class="name">未佩戴安全帽</span><span class="tag tag-info">低风险</span></div><div class="meta">位置：作业区西侧人员</div><div class="conf">置信度 88%</div><div class="fix">整改建议：要求现场人员正确佩戴安全帽。</div></div>`;
uploadBtn.addEventListener("click",()=>{emptyState.style.display="none";imageFrame.classList.add("show");reportBody.innerHTML=reportHtml});
</script>
</body>
</html>
